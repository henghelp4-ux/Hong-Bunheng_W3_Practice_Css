<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<style>
    div {
        margin-left: 100px;
        margin-right: 100px;
        margin-bottom: 30px;
        padding: 20px;
        border-radius: 10px;
    }

    button {
        border-radius: 30px;
        padding: 10px;
        border: none;


    }

    button:hover {
        cursor: pointer;
        color: aquamarine;
        filter: brightness(100%);
    }
</style>

<body>

    <div style="background-color: white;">
        <p>Keep track of daily activities can boost productivity and, thus, reduce anxiety.</p>
        <button style="background-color: darkgreen;">Read more >></button>
    </div>
    <div style="background-color: white;">
        <p>Have a roadmap, reducing distractions, overwhelm or stress</p>
        <button style="background-color: rgb(1, 158, 163);">Read more >></button>
    </div>
    <div style="background-color: white;">
        <p>Write a to-do list to give you significant control over how your day will look</p>
        <button style="background-color: rgb(184, 105, 2);">Read more >></button>
    </div>
</body>

</html>
